name: 安卓 ECH 正式构建
on:
  push:
    branches: [ech-conscrypt]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ech-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
          log-accepted-android-sdk-licenses: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: 装 NDK 与 cargo-ndk
        run: |
          sdkmanager --install "ndk;27.0.12077973" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          command -v cargo-ndk || cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-h3

      - name: 取 quiche 源码并打 ECH 补丁
        run: |
          set -e
          curl -sSL https://static.crates.io/crates/quiche/quiche-0.22.0.crate -o /tmp/quiche.crate
          mkdir -p native-h3/vendor && tar -xzf /tmp/quiche.crate -C native-h3/vendor
          rm -rf native-h3/vendor/quiche && mv native-h3/vendor/quiche-0.22.0 native-h3/vendor/quiche
          python3 tools/patch_quiche.py native-h3/vendor/quiche

      - name: 编 H3 原生库（铁律：只留主库 + 验 JNI 符号）
        run: |
          set -e
          cd native-h3
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../android/src/main/jniLibs build --release --lib
          find ../android/src/main/jniLibs -name "libquiche*.so" -delete
          NM=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          for abi in arm64-v8a armeabi-v7a; do
            n=$($NM -D ../android/src/main/jniLibs/$abi/libbgm_h3.so | grep -c "Java_com_xiaoyv_bangumi_shared_libnative_ech_BgmEchH3_h3Fetch" || true)
            echo "$abi JNI 符号命中: $n"
            [ "$n" -gt 0 ] || { echo "✗ $abi 缺 JNI 符号"; exit 1; }
          done
      - name: 注入 Firebase 配置
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(os.environ["FIREBASE_CONFIG"])
          packages = [c["client_info"]["android_client_info"]["package_name"] for c in config["client"]]
          assert "com.anglesgirl.bangumi.ech" in packages, "Firebase 包名不匹配"
          assert config["project_info"]["project_id"] == "bangumi-49d41", "Firebase 项目不匹配"
          Path("android/google-services.json").write_text(json.dumps(config))
          PY
      - name: 源码门禁
        run: |
          python3 tools/check_ech_policy.py
          python3 tools/check_ech_transport.py
          python3 tools/check_ech_webview.py
          python3 tools/check_ech_workflow.py
          python3 tools/check_firebase_config.py
          python3 tools/check_image_source.py
          python3 tools/extract_webview_bridge.py /tmp/bgm-ech-bridge.js
          node --check /tmp/bgm-ech-bridge.js
          node tools/webview_bridge_test.js /tmp/bgm-ech-bridge.js
      - name: 构建调试包
        env:
          ECH_DOH_POOL: ${{ secrets.ECH_DOH_POOL }}
        run: |
          test -n "$ECH_DOH_POOL" || { printf '缺少 ECH 网关配置\n'; exit 1; }
          { free -h; df -h .; } | tee runner-resources.log
          set +e
          ./gradlew :android:assembleDebug -PenableIos=false \
            "-PappVersionCode=$(( 2026083110 + ${{ github.run_number }} ))" \
            --stacktrace --console=plain --max-workers=2 --no-parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx1g 2>&1 | tee gradle-debug.log
          result=${PIPESTATUS[0]}
          { free -h; df -h .; } >> runner-resources.log
          exit "$result"
      - name: 构建正式包
        env:
          ECH_DOH_POOL: ${{ secrets.ECH_DOH_POOL }}
        run: |
          test -n "$ECH_DOH_POOL" || { printf '缺少 ECH 网关配置\n'; exit 1; }
          set +e
          ./gradlew :android:assembleRelease -PenableIos=false \
            "-PappVersionCode=$(( 2026083110 + ${{ github.run_number }} ))" \
            --stacktrace --console=plain --max-workers=2 --no-parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx1g 2>&1 | tee gradle-release.log
          result=${PIPESTATUS[0]}
          { free -h; df -h .; } >> runner-resources.log
          exit "$result"
      - name: 校验正式包内含网关资源
        env:
          ECH_DOH_POOL: ${{ secrets.ECH_DOH_POOL }}
        run: |
          python3 - <<'PY'
          import os, zipfile, pathlib
          from urllib.parse import urlparse
          apks = sorted(pathlib.Path('android/build/outputs/apk/release').glob('*arm64-v8a*.apk'))
          assert apks, '缺少正式包'
          text = zipfile.ZipFile(apks[0]).read('resources.arsc').decode('utf-8', errors='ignore')
          assert 'ech_doh_pool' in text, '资源压缩删掉了网关资源，正式包会阻断全部受保护域名'
          host = urlparse(os.environ['ECH_DOH_POOL'].split(',')[0].split('|')[0]).hostname
          assert host in text, '正式包里没注入网关地址'
          print('正式包网关资源校验通过：', host)
          PY
      - name: 保存诊断日志
        # 只在失败时上传：Actions 产物配额常年吃紧，没必要每次绿灯都占一份。
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            gradle-debug.log
            gradle-release.log
            runner-resources.log
          retention-days: 3
          if-no-files-found: ignore
      - name: 保存私有正式包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "ech-${GITHUB_RUN_ID}" \
            android/build/outputs/apk/release/*arm64-v8a*.apk \
            android/build/outputs/apk/debug/*arm64-v8a*.apk \
            --target "$GITHUB_SHA" \
            --title "安卓正式版 ${GITHUB_SHA:0:8}" \
            --notes "提交：$GITHUB_SHA。release 包已启用 R8 混淆与资源压缩；debug 包用于对比。原生请求与 WebView（GET/HEAD 拦截 + 非 GET 传输桥）都走 ECH。"
