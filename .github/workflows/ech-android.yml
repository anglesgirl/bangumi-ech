name: 安卓 ECH 测试构建
on:
  push:
    branches: [ech-conscrypt]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ech-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37'
          log-accepted-android-sdk-licenses: false
      - name: 源码门禁
        run: |
          python3 tools/check_ech_policy.py
          python3 tools/check_ech_transport.py
      - name: 构建安卓测试包
        env:
          ECH_DOH_POOL: ${{ secrets.ECH_DOH_POOL }}
        run: |
          ./gradlew :android:assembleDebug -PenableIos=false --stacktrace
      - name: 保存测试包
        uses: actions/upload-artifact@v4
        with:
          name: bangumi-ech-debug-${{ github.sha }}
          path: android/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
      - name: 保存构建报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports/'
          if-no-files-found: ignore
