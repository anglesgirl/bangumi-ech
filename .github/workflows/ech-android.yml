name: 安卓 ECH 测试构建
on:
  push:
    branches: [ech-conscrypt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ech-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
          log-accepted-android-sdk-licenses: false
      - name: 源码门禁
        run: |
          python3 tools/check_ech_policy.py
          python3 tools/check_ech_transport.py
      - name: 构建安卓测试包
        env:
          ECH_DOH_POOL: ${{ secrets.ECH_DOH_POOL }}
        run: |
          ./gradlew :android:assembleDebug -PenableIos=false --stacktrace
      - name: 保存私有测试包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "test-${GITHUB_RUN_ID}" \
            android/build/outputs/apk/debug/*arm64-v8a*.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "安卓测试 ${GITHUB_SHA:0:8}" \
            --notes "提交：$GITHUB_SHA。仅原生网络 ECH 测试，WebView 尚未接入，禁止输入真实账号。"
