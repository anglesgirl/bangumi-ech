name: 安卓 ECH 正式构建
on:
  push:
    branches: [ech-conscrypt]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ech-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
          log-accepted-android-sdk-licenses: false
      - name: 注入 Firebase 配置
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(os.environ["FIREBASE_CONFIG"])
          packages = [c["client_info"]["android_client_info"]["package_name"] for c in config["client"]]
          assert "com.anglesgirl.bangumi.ech" in packages, "Firebase 包名不匹配"
          assert config["project_info"]["project_id"] == "bangumi-49d41", "Firebase 项目不匹配"
          Path("android/google-services.json").write_text(json.dumps(config))
          PY
      - name: 源码门禁
        run: |
          python3 tools/check_ech_policy.py
          python3 tools/check_ech_transport.py
          python3 tools/check_ech_webview.py
          python3 tools/check_firebase_config.py
          python3 tools/extract_webview_bridge.py /tmp/bgm-ech-bridge.js
          node --check /tmp/bgm-ech-bridge.js
          node tools/webview_bridge_test.js /tmp/bgm-ech-bridge.js
      - name: 构建调试包
        env:
          ECH_DOH_POOL: ${{ secrets.ECH_DOH_POOL }}
        run: |
          test -n "$ECH_DOH_POOL" || { printf '缺少 ECH 网关配置\n'; exit 1; }
          { free -h; df -h .; } | tee runner-resources.log
          set +e
          ./gradlew :android:assembleDebug -PenableIos=false --stacktrace --console=plain --max-workers=2 --no-parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx1g 2>&1 | tee gradle-debug.log
          result=${PIPESTATUS[0]}
          { free -h; df -h .; } >> runner-resources.log
          exit "$result"
      - name: 构建正式包
        env:
          ECH_DOH_POOL: ${{ secrets.ECH_DOH_POOL }}
        run: |
          set +e
          ./gradlew :android:assembleRelease -PenableIos=false --stacktrace --console=plain --max-workers=2 --no-parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx1g 2>&1 | tee gradle-release.log
          result=${PIPESTATUS[0]}
          { free -h; df -h .; } >> runner-resources.log
          exit "$result"
      - name: 校验正式包内含网关资源
        env:
          ECH_DOH_POOL: ${{ secrets.ECH_DOH_POOL }}
        run: |
          python3 - <<'PY'
          import os, zipfile, pathlib
          from urllib.parse import urlparse
          apks = sorted(pathlib.Path('android/build/outputs/apk/release').glob('*arm64-v8a*.apk'))
          assert apks, '缺少正式包'
          text = zipfile.ZipFile(apks[0]).read('resources.arsc').decode('utf-8', errors='ignore')
          assert 'ech_doh_pool' in text, '资源压缩删掉了网关资源，正式包会阻断全部受保护域名'
          host = urlparse(os.environ['ECH_DOH_POOL'].split(',')[0].split('|')[0]).hostname
          assert host in text, '正式包里没注入网关地址'
          print('正式包网关资源校验通过：', host)
          PY
      - name: 保存诊断日志
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            gradle-debug.log
            gradle-release.log
            runner-resources.log
          retention-days: 3
          if-no-files-found: ignore
      - name: 保存私有正式包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "ech-${GITHUB_RUN_ID}" \
            android/build/outputs/apk/release/*arm64-v8a*.apk \
            android/build/outputs/apk/debug/*arm64-v8a*.apk \
            --target "$GITHUB_SHA" \
            --title "安卓正式版 ${GITHUB_SHA:0:8}" \
            --notes "提交：$GITHUB_SHA。release 包已启用 R8 混淆与资源压缩；debug 包用于对比。原生请求走 ECH，WebView 尚未接入。"
