name: 安卓 ECH 测试构建
on:
  push:
    branches: [ech-conscrypt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ech-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
          log-accepted-android-sdk-licenses: false
      - name: 注入 Firebase 配置
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(os.environ["FIREBASE_CONFIG"])
          packages = [c["client_info"]["android_client_info"]["package_name"] for c in config["client"]]
          assert "com.anglesgirl.bangumi.ech" in packages, "Firebase 包名不匹配"
          assert config["project_info"]["project_id"] == "bangumi-49d41", "Firebase 项目不匹配"
          Path("android/google-services.json").write_text(json.dumps(config))
          PY
      - name: 源码门禁
        run: |
          python3 tools/check_ech_policy.py
          python3 tools/check_ech_transport.py
          python3 tools/check_firebase_config.py
      - name: 构建安卓测试包
        env:
          ECH_DOH_POOL: ${{ secrets.ECH_DOH_POOL }}
        run: |
          test -n "$ECH_DOH_POOL" || { printf '缺少 ECH 网关配置\n'; exit 1; }
          { free -h; df -h .; } | tee runner-resources.log
          set +e
          ./gradlew :android:assembleDebug -PenableIos=false --stacktrace --console=plain --max-workers=2 --no-parallel --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx1g 2>&1 | tee gradle-build.log
          result=${PIPESTATUS[0]}
          { free -h; df -h .; } >> runner-resources.log
          exit "$result"
      - name: 保存诊断日志
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            gradle-build.log
            runner-resources.log
          retention-days: 3
          if-no-files-found: ignore
      - name: 保存私有测试包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "test-${GITHUB_RUN_ID}" \
            android/build/outputs/apk/debug/*arm64-v8a*.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "安卓测试 ${GITHUB_SHA:0:8}" \
            --notes "提交：$GITHUB_SHA。仅原生网络 ECH 测试，WebView 尚未接入，禁止输入真实账号。"
